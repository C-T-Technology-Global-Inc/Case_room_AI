# Local infrastructure for Clinical Case Room.
#   docker compose up -d postgres          # database only
#   docker compose up -d                   # database + MinIO (S3-compatible storage)
# Then set in .env:
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/clinical_case_room"
#   S3_BUCKET="case-room" S3_ENDPOINT="http://localhost:9000" S3_ACCESS_KEY_ID="minio" S3_SECRET_ACCESS_KEY="minio-secret" S3_FORCE_PATH_STYLE="true"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinical_case_room
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 minio minio-secret && mc mb --ignore-existing local/case-room"

volumes:
  postgres-data:
  minio-data:
